name: Issue 98439 patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/issue98439-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/98439-remove-redundant-task-fields
          fetch-depth: 2

      - name: Add regression test
        shell: bash
        run: |
          cat > tests/unit/ReportUtilsBuildOptimisticTaskReportActionTest.ts <<'EOF'
          import {buildOptimisticTaskReportAction} from '@libs/ReportUtils';

          import CONST from '@src/CONST';

          describe('buildOptimisticTaskReportAction', () => {
              const taskReportID = '123';
              const message = 'Task action message';
              const actionNames = [
                  CONST.REPORT.ACTIONS.TYPE.TASK_COMPLETED,
                  CONST.REPORT.ACTIONS.TYPE.TASK_REOPENED,
                  CONST.REPORT.ACTIONS.TYPE.TASK_CANCELLED,
              ] as const;

              it.each(actionNames)('omits redundant originalMessage text and html for %s', (actionName) => {
                  const action = buildOptimisticTaskReportAction(taskReportID, actionName, undefined, message);

                  expect(action.originalMessage).not.toHaveProperty('text');
                  expect(action.originalMessage).not.toHaveProperty('html');
                  expect(action.message?.[0]?.text).toBe(message);
              });
          });
          EOF

      - name: Remove redundant task originalMessage fields
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('src/libs/ReportUtils.ts')
          source = path.read_text()
          pattern = re.compile(
              r'(const originalMessage = \{\n\s*taskReportID,\n\s*type: actionName,\n)'
              r'\s*text: message,\n\s*html: message,\n'
              r'(\s*whisperedTo: \[\],\n\s*\};)'
          )
          patched, count = pattern.subn(r'\1\2', source, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one task originalMessage structure, replaced {count}')
          path.write_text(patched)
          PY

      - name: Set up Node and dependencies
        uses: ./.github/actions/composite/setupNode

      - name: Verify targeted test and formatting
        shell: bash
        run: |
          npm run test -- tests/unit/ReportUtilsBuildOptimisticTaskReportActionTest.ts --runInBand
          npx eslint --max-warnings=0 src/libs/ReportUtils.ts tests/unit/ReportUtilsBuildOptimisticTaskReportActionTest.ts
          git diff --check

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "Elite"
          git config user.email "53697836+plantrungnampl@users.noreply.github.com"
          git add src/libs/ReportUtils.ts tests/unit/ReportUtilsBuildOptimisticTaskReportActionTest.ts
          git commit -m "Remove redundant text/html from optimistic task actions"
          git push origin HEAD:fix/98439-remove-redundant-task-fields
